<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="100%" direction="rtl">
  <defs>
    <linearGradient id="gy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE580"/>
      <stop offset=".45" stop-color="#F5C518"/>
      <stop offset="1" stop-color="#C99A0A"/>
    </linearGradient>
    <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6BA8E8"/>
      <stop offset=".45" stop-color="#2E7DD1"/>
      <stop offset="1" stop-color="#1B5799"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8E7"/>
      <stop offset="1" stop-color="#E9F3FF"/>
    </linearGradient>
  </defs>

  <rect width="400" height="340" rx="18" fill="url(#bg)"/>

  <text x="24" y="40" font-size="16" text-anchor="middle" fill="#F5C518" opacity="0">✦<animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0s" repeatCount="indefinite"/></text>
  <text x="376" y="50" font-size="16" text-anchor="middle" fill="#F5C518" opacity="0">✦<animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1s" repeatCount="indefinite"/></text>
  <text x="18" y="300" font-size="16" text-anchor="middle" fill="#F5C518" opacity="0">✦<animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></text>
  <text x="384" y="296" font-size="16" text-anchor="middle" fill="#F5C518" opacity="0">✦<animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></text>
  <text x="200" y="24" font-size="16" text-anchor="middle" fill="#F5C518" opacity="0">✦<animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="2s" repeatCount="indefinite"/></text>

  <rect x="100" y="14" width="200" height="38" rx="19.0" fill="#5B2C87"/>
  <text x="200.0" y="40.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff">رحلة السوروبان</text>

  <path id="p" d="M330 190 Q265 110 200 190 T70 190" fill="none" stroke="#B77CE0" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/>

  <g transform="translate(330 190)">
    <g>
      <circle r="42" fill="#E67E22"/>
      <circle r="42" fill="none" stroke="#fff" stroke-width="4" opacity=".6"/>
      <text y="14" font-size="40" text-anchor="middle">🪨</text>
      <rect x="-52" y="52" width="104" height="30" rx="15" fill="#E67E22"/>
      <text y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#fff">العدّ القديم</text>
      <animateTransform attributeName="transform" type="scale" values="0;0;1.2;1;1;0;0" keyTimes="0;0.040;0.080;0.110;.92;.96;1" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(200 190)">
    <g>
      <circle r="42" fill="#2E8B57"/>
      <circle r="42" fill="none" stroke="#fff" stroke-width="4" opacity=".6"/>
      <text y="14" font-size="40" text-anchor="middle">🗾</text>
      <rect x="-52" y="52" width="104" height="30" rx="15" fill="#2E8B57"/>
      <text y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#fff">اليابان</text>
      <animateTransform attributeName="transform" type="scale" values="0;0;1.2;1;1;0;0" keyTimes="0;0.340;0.380;0.410;.92;.96;1" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(70 190)">
    <g>
      <circle r="42" fill="#7B3FA0"/>
      <circle r="42" fill="none" stroke="#fff" stroke-width="4" opacity=".6"/>
      <text y="14" font-size="40" text-anchor="middle">🧮</text>
      <rect x="-52" y="52" width="104" height="30" rx="15" fill="#7B3FA0"/>
      <text y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#fff">السوروبان</text>
      <animateTransform attributeName="transform" type="scale" values="0;0;1.2;1;1;0;0" keyTimes="0;0.640;0.680;0.710;.92;.96;1" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <circle r="9" fill="#F5C518" stroke="#fff" stroke-width="3">
    <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.8;1" calcMode="linear">
      <mpath href="#p"/>
    </animateMotion>
  </circle>

  <text x="200" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5B2C87" font-weight="bold">من الحصى القديمة إلى السوروبان! ✨</text>

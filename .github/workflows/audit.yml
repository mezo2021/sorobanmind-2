name: Audit
on: workflow_dispatch
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: |
          echo "=== بنية الملفات ===" > audit-report.txt
          find src -name "*.ts" -o -name "*.tsx" | xargs wc -l | sort -n >> audit-report.txt
          
          echo "" >> audit-report.txt
          echo "=== من يستورد bank-v2 ===" >> audit-report.txt
          grep -rn "bank-v2" src --include="*.ts" --include="*.tsx" >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== من يستورد bank-raw ===" >> audit-report.txt
          grep -rn "bank-raw" src --include="*.ts" --include="*.tsx" >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== من يستورد srb ===" >> audit-report.txt
          grep -rn "from '@/data/srb" src --include="*.ts" --include="*.tsx" >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== srb-adapter / bank-linked / bank-adapter ===" >> audit-report.txt
          grep -rn "srb-adapter\|bank-linked\|bank-adapter" src >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== progressStore ===" >> audit-report.txt
          grep -rn "progressStore" src --include="*.ts" --include="*.tsx" >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== كل localStorage ===" >> audit-report.txt
          grep -rn "localStorage" src --include="*.ts" --include="*.tsx" >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== حالات App.tsx ===" >> audit-report.txt
          grep -n "case '" src/App.tsx >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== بنك srb/exam ===" >> audit-report.txt
          grep -c "makeQuestion" src/data/srb/exam/L*.ts >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== من يستورد srb/questions ===" >> audit-report.txt
          grep -rn "srb/questions" src --include="*.ts" --include="*.tsx" >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== من يستورد LevelScreen / LevelTestScreen ===" >> audit-report.txt
          grep -rn "LevelScreen\|LevelTestScreen" src --include="*.ts" --include="*.tsx" >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== من يستورد curriculum ===" >> audit-report.txt
          grep -rn "from.*curriculum" src --include="*.ts" --include="*.tsx" >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== من يستورد srb/progress ===" >> audit-report.txt
          grep -rn "srb/progress" src >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== من يستورد bank.ts ===" >> audit-report.txt
          grep -rn "from '@/data/bank'\|from './bank'\|from '../data/bank'" src >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== من يستورد numberStyleStore ===" >> audit-report.txt
          grep -rn "numberStyleStore" src >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== adaptiveEngine / problemGenerator / masteryTracker ===" >> audit-report.txt
          grep -rn "adaptiveEngine\|problemGenerator\|masteryTracker" src --include="*.ts" --include="*.tsx" >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== sorobanEngine / sorobanMoves / SorobanEngineDebug ===" >> audit-report.txt
          grep -rn "sorobanEngine\|sorobanMoves\|SorobanEngineDebug" src --include="*.ts" --include="*.tsx" >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== audioAnzanBadges / skillsChecker / anzanBadges ===" >> audit-report.txt
          grep -rn "audioAnzanBadges\|skillsChecker\|anzanBadges" src --include="*.ts" --include="*.tsx" >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== من يستورد srb/exam ===" >> audit-report.txt
          grep -rn "srb/exam" src --include="*.ts" --include="*.tsx" >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== محتوى package.json ===" >> audit-report.txt
          cat package.json >> audit-report.txt || true
          
      - uses: actions/upload-artifact@v4
        with:
          name: audit-report-v2
          path: audit-report.txt

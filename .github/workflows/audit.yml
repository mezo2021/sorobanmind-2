name: Audit
on: workflow_dispatch
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: |
          echo "=== بنية الملفات ===" > audit-report.txt
          find src -name "*.ts" -o -name "*.tsx" | xargs wc -l | sort -n >> audit-report.txt
          
          echo "" >> audit-report.txt
          echo "=== من يستورد bank-v2 ===" >> audit-report.txt
          grep -rn "bank-v2" src --include="*.ts" --include="*.tsx" >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== من يستورد bank-raw ===" >> audit-report.txt
          grep -rn "bank-raw" src --include="*.ts" --include="*.tsx" >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== حالات App.tsx ===" >> audit-report.txt
          grep -n "case '" src/App.tsx >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== بنك srb/exam ===" >> audit-report.txt
          grep -c "makeQuestion" src/data/srb/exam/L*.ts >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== من يستورد srb/questions ===" >> audit-report.txt
          grep -rn "srb/questions" src --include="*.ts" --include="*.tsx" >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== من يستورد LevelScreen / LevelTestScreen ===" >> audit-report.txt
          grep -rn "LevelScreen\|LevelTestScreen" src --include="*.ts" --include="*.tsx" >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== من يستورد data/curriculum ===" >> audit-report.txt
          grep -rn "from '@/data/curriculum'\|from '../data/curriculum'" src >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== من يستورد CURRICULUM_GROUPS أو LEVELS ===" >> audit-report.txt
          grep -rn "CURRICULUM_GROUPS\|CURRICULUM_LEVELS" src >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== من يستورد utils/numberStyle ===" >> audit-report.txt
          grep -rn "utils/numberStyle" src >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== من يستورد utils/numerals ===" >> audit-report.txt
          grep -rn "utils/numerals" src >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== من يستورد data/index ===" >> audit-report.txt
          grep -rn "from '@/data'\|from './data'" src >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== من يستورد srb/exam ===" >> audit-report.txt
          grep -rn "srb/exam" src --include="*.ts" --include="*.tsx" >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== محتوى package.json ===" >> audit-report.txt
          cat package.json >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== من يستورد i18n ===" >> audit-report.txt
          grep -rn "from '@/i18n\|from './i18n'\|from '../i18n'" src >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== من يستورد useTranslation ===" >> audit-report.txt
          grep -rn "useTranslation" src >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== من يستورد arabicNumbers ===" >> audit-report.txt
          grep -rn "arabicNumbers" src >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== زر تبديل اللغة ===" >> audit-report.txt
          grep -rn "toggleLanguage\|switchLanguage\|setLanguage\|currentLang\|LanguageToggle" src >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== كيف تُبنى skillProgress في progressStore ===" >> audit-report.txt
          grep -n -B 3 -A 10 "skillProgress" src/store/progressStore.ts >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== recordAttempt في progressStore ===" >> audit-report.txt
          grep -n -B 5 -A 20 "recordAttempt" src/store/progressStore.ts >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== كيف يُستدعى recordAttempt في الشاشات ===" >> audit-report.txt
          grep -rn "recordAttempt" src/screens >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== skillId في masteryTracker ===" >> audit-report.txt
          grep -n "skillId" src/engine/masteryTracker.ts >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== كيف يُستدعى createAttempt في masteryTracker ===" >> audit-report.txt
          grep -n -A 15 "createAttempt" src/engine/masteryTracker.ts >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== getSkillId مُستخدَم في الكود ===" >> audit-report.txt
          grep -rn "getSkillId\|getSectionId\|generateSrbId\|parseSrbId" src --include="*.ts" --include="*.tsx" >> audit-report.txt || true
          
          echo "" >> audit-report.txt
          echo "=== صيغة skillId في SRB (بحث L0-S01-m1) ===" >> audit-report.txt
          grep -rn "L0-S01-m1\|SRB-L0-S01-m1" src --include="*.ts" --include="*.tsx" >> audit-report.txt || true
          echo "" >> audit-report.txt
          echo "=== استدعاءات setAnzanBadge ===" >> audit-report.txt
          grep -rn "setAnzanBadge" src >> audit-report.txt || true

          echo "" >> audit-report.txt
          echo "=== استدعاءات setAnzanAudioBadge ===" >> audit-report.txt
          grep -rn "setAnzanAudioBadge" src >> audit-report.txt || true

          echo "" >> audit-report.txt
          echo "=== استخدامات masteryBadgesStore ===" >> audit-report.txt
          grep -rn "masteryBadgesStore\|useMasteryBadgesStore" src >> audit-report.txt || true

          echo "" >> audit-report.txt
          echo "=== استدعاءات masteryBadges (award · add · set) ===" >> audit-report.txt
          grep -rn "awardBadge\|addBadge\|masterBadge\|masteredAt" src >> audit-report.txt || true

          echo "" >> audit-report.txt
          echo "=== من يمنح mastery badge ===" >> audit-report.txt
          grep -rn "masteryBadges\." src --include="*.ts" --include="*.tsx" >> audit-report.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: audit-report-v4
          path: audit-report.txt

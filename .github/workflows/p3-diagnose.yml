name: P3 Diagnose Imports
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report
        run: |
          {
            echo "### App.tsx imports (first 60 lines)"
            echo '```'
            head -60 src/App.tsx
            echo '```'
            echo ""
            echo "### App.tsx total lines"
            wc -l src/App.tsx
            echo ""
            echo "### main.tsx full content"
            echo '```'
            cat src/main.tsx
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

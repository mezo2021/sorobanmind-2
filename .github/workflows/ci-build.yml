name: CI Build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Bundle report
        if: always()
        run: |
          {
            echo '### Build output'
            echo '```'
            grep -E 'dist/|built in|error|dynamically imported' build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

name: CI Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Report
        if: always()
        run: |
          {
            echo '### Build output'
            echo '```'
            grep -E 'dist/assets/.*\.js|built in|error' build.log | head -80
            echo '```'
            echo '### Eager assets (loaded by index.html)'
            echo '```'
            grep -oE 'assets/[^"]+\.(js|css)' dist/index.html || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

name: Update package-lock helper

on:
  push:
    branches:
      - vault-engine
    paths:
      - '.github/workflows/update-package-lock.yml'

permissions:
  contents: read

jobs:
  generate-lock:
    name: Generate and validate package-lock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout vault-engine
        uses: actions/checkout@v4
        with:
          ref: vault-engine

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify project files
        run: |
          test -f package.json
          test -f package-lock.json

      - name: Update package-lock only
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package.json

      - name: Validate lock with npm ci
        run: npm ci --no-audit --no-fund

      - name: Upload updated package-lock
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-node20
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3

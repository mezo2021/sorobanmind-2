name: Keep Supabase Alive
on:
  schedule:
    # يعمل كل يوم الساعة 3 صباحاً بتوقيت UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # يتيح لك تشغيله يدوياً للتجربة

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Health Endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
          https://tnaetkpmqdmltfbigysp.supabase.co/auth/v1/health